name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Verify the module exactly as released, never through a local workspace.
  GOWORK: "off"

jobs:
  test:
    name: test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25.x", "oldstable", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go.sum
      - name: Verify modules
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: Enforce test assertion policy
        # Tests assert with testify (assert/require), never t.Fatal or t.Error.
        run: |
          if grep -REn --include='*_test.go' '\bt\.(Fatal|Fatalf|Error|Errorf|Fail|FailNow)\b' .; then
            exit 1
          fi
      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Service images are pinned by tag; pin them by digest
    # (image: name:tag@sha256:...) when updating them.
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      dragonfly:
        image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.38.0
        ports:
          - 6380:6379
      valkey:
        image: valkey/valkey:8.1-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      memcached:
        image: memcached:1.6-alpine
        ports:
          - 11211:11211
      hazelcast:
        image: hazelcast/hazelcast:5.5
        ports:
          - 5701:5701
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cache_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cache_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      REDIS_ADDR: 127.0.0.1:6379
      DRAGONFLY_ADDR: 127.0.0.1:6380
      VALKEY_ADDR: 127.0.0.1:6381
      MEMCACHED_ADDR: 127.0.0.1:11211
      HAZELCAST_ADDR: 127.0.0.1:5701
      POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/cache_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - name: Wait for services
        run: |
          for port in 6379 6380 6381 11211 5701 5432; do
            timeout 120 bash -c "until (echo > /dev/tcp/127.0.0.1/$port) >/dev/null 2>&1; do sleep 1; done"
          done
      - name: Integration tests
        run: |
          go test -race -count=1 -tags=integration -timeout=10m \
            ./backend/redis/... \
            ./backend/dragonfly/... \
            ./backend/valkey/... \
            ./backend/memcached/... \
            ./backend/hazelcast/... \
            ./backend/postgres/...
