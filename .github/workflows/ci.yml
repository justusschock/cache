name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GOPRIVATE: "github.com/justusschock/*"
  GONOSUMDB: "github.com/justusschock/*"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go:
          - "1.25.x"
          - "1.26.x"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Require private module credentials
        shell: bash
        env:
          GO_MODULES_TOKEN: ${{ secrets.GO_MODULES_TOKEN }}
        run: |
          if [[ -z "$GO_MODULES_TOKEN" ]]; then
            echo "::error title=Missing GitHub Actions secret::GO_MODULES_TOKEN is required for private Go modules"
            exit 1
          fi
      - name: Authenticate private module Git access
        shell: bash
        env:
          GO_MODULES_TOKEN: ${{ secrets.GO_MODULES_TOKEN }}
        run: |
          auth_url="https://x-access-token:${GO_MODULES_TOKEN}@github.com/"
          git config --global url."${auth_url}".insteadOf "https://github.com/"
          git config --global --add url."${auth_url}".insteadOf "git@github.com:"
          git config --global --add url."${auth_url}".insteadOf "ssh://git@github.com/"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
          cache-dependency-path: go.sum
      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - name: Enforce test assertion policy
        run: |
          if grep -REn --include='*_test.go' '\bt\.(Fatal|Fatalf|Error|Errorf|Fail|FailNow)\b' .; then
            exit 1
          fi
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race ./...

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      dragonfly:
        image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.38.0
        ports:
          - 6380:6379
      valkey:
        image: valkey/valkey:8.1-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      memcached:
        image: memcached:1.6-alpine
        ports:
          - 11211:11211
      hazelcast:
        image: hazelcast/hazelcast:5.5
        ports:
          - 5701:5701
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cache_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cache_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      REDIS_ADDR: 127.0.0.1:6379
      DRAGONFLY_ADDR: 127.0.0.1:6380
      VALKEY_ADDR: 127.0.0.1:6381
      MEMCACHED_ADDR: 127.0.0.1:11211
      HAZELCAST_ADDR: 127.0.0.1:5701
      POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/cache_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Require private module credentials
        shell: bash
        env:
          GO_MODULES_TOKEN: ${{ secrets.GO_MODULES_TOKEN }}
        run: |
          if [[ -z "$GO_MODULES_TOKEN" ]]; then
            echo "::error title=Missing GitHub Actions secret::GO_MODULES_TOKEN is required for private Go modules"
            exit 1
          fi
      - name: Authenticate private module Git access
        shell: bash
        env:
          GO_MODULES_TOKEN: ${{ secrets.GO_MODULES_TOKEN }}
        run: |
          auth_url="https://x-access-token:${GO_MODULES_TOKEN}@github.com/"
          git config --global url."${auth_url}".insteadOf "https://github.com/"
          git config --global --add url."${auth_url}".insteadOf "git@github.com:"
          git config --global --add url."${auth_url}".insteadOf "ssh://git@github.com/"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true
      - name: Wait for services
        run: |
          for port in 6379 6380 6381 11211 5701 5432; do
            timeout 120 bash -c "until (echo > /dev/tcp/127.0.0.1/$port) >/dev/null 2>&1; do sleep 1; done"
          done
      - name: Redis integration tests
        working-directory: backend/redis
        run: go test -race -tags=integration -timeout=3m ./...
      - name: Dragonfly integration tests
        working-directory: backend/dragonfly
        run: go test -race -tags=integration -timeout=3m ./...
      - name: Valkey integration tests
        working-directory: backend/valkey
        run: go test -race -tags=integration -timeout=3m ./...
      - name: Memcached integration tests
        working-directory: backend/memcached
        run: go test -race -tags=integration -timeout=3m ./...
      - name: Hazelcast integration tests
        working-directory: backend/hazelcast
        run: go test -race -tags=integration -timeout=3m ./...
      - name: PostgreSQL integration tests
        working-directory: backend/postgres
        run: go test -race -tags=integration -timeout=3m ./...

  release-isolation:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Require private module credentials
        shell: bash
        env:
          GO_MODULES_TOKEN: ${{ secrets.GO_MODULES_TOKEN }}
        run: |
          if [[ -z "$GO_MODULES_TOKEN" ]]; then
            echo "::error title=Missing GitHub Actions secret::GO_MODULES_TOKEN is required for private Go modules"
            exit 1
          fi
      - name: Authenticate private module Git access
        shell: bash
        env:
          GO_MODULES_TOKEN: ${{ secrets.GO_MODULES_TOKEN }}
        run: |
          auth_url="https://x-access-token:${GO_MODULES_TOKEN}@github.com/"
          git config --global url."${auth_url}".insteadOf "https://github.com/"
          git config --global --add url."${auth_url}".insteadOf "git@github.com:"
          git config --global --add url."${auth_url}".insteadOf "ssh://git@github.com/"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true
      - name: Verify released dependency graph without a workspace
        env:
          GOWORK: "off"
        run: |
          go mod download
          go vet ./...
          go test -race ./...
