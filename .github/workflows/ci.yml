name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - backend/disk
          - backend/postgres
          - backend/redis
          - backend/valkey
          - backend/dragonfly
          - backend/memcached
          - backend/hazelcast
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Prepare local module workspace
        working-directory: ${{ github.workspace }}
        run: |
          go work init .
          go work use backend/disk backend/postgres backend/redis backend/valkey
          go work use backend/dragonfly backend/memcached backend/hazelcast
          go work edit -go=1.26
          go work edit -replace=github.com/justusschock/go-cache@v0.1.0=.
          go work edit -replace=github.com/justusschock/go-cache/backend/redis@v0.1.0=./backend/redis
      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - name: Enforce test assertion policy
        run: |
          if grep -REn --include='*_test.go' '\bt\.(Fatal|Fatalf|Error|Errorf|Fail|FailNow)\b' .; then
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      dragonfly:
        image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.38.0
        ports:
          - 6380:6379
      valkey:
        image: valkey/valkey:8.1-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      memcached:
        image: memcached:1.6-alpine
        ports:
          - 11211:11211
      hazelcast:
        image: hazelcast/hazelcast:5.5
        ports:
          - 5701:5701
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cache_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cache_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      REDIS_ADDR: 127.0.0.1:6379
      DRAGONFLY_ADDR: 127.0.0.1:6380
      VALKEY_ADDR: 127.0.0.1:6381
      MEMCACHED_ADDR: 127.0.0.1:11211
      HAZELCAST_ADDR: 127.0.0.1:5701
      POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/cache_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Prepare local module workspace
        run: |
          go work init .
          go work use backend/disk backend/postgres backend/redis backend/valkey
          go work use backend/dragonfly backend/memcached backend/hazelcast
          go work edit -go=1.26
          go work edit -replace=github.com/justusschock/go-cache@v0.1.0=.
          go work edit -replace=github.com/justusschock/go-cache/backend/redis@v0.1.0=./backend/redis
      - name: Wait for services
        run: |
          for port in 6379 6380 6381 11211 5701 5432; do
            timeout 120 bash -c "until (echo > /dev/tcp/127.0.0.1/$port) >/dev/null 2>&1; do sleep 1; done"
          done
      - name: Redis integration tests
        working-directory: backend/redis
        run: go test -race -tags=integration -timeout=3m ./...
      - name: Dragonfly integration tests
        working-directory: backend/dragonfly
        run: go test -race -tags=integration -timeout=3m ./...
      - name: Valkey integration tests
        working-directory: backend/valkey
        run: go test -race -tags=integration -timeout=3m ./...
      - name: Memcached integration tests
        working-directory: backend/memcached
        run: go test -race -tags=integration -timeout=3m ./...
      - name: Hazelcast integration tests
        working-directory: backend/hazelcast
        run: go test -race -tags=integration -timeout=3m ./...
      - name: PostgreSQL integration tests
        working-directory: backend/postgres
        run: go test -race -tags=integration -timeout=3m ./...

  release-isolation:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Select tagged module
        id: module
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            module="."
          else
            module="${GITHUB_REF_NAME%/v*}"
          fi
          test -f "$module/go.mod"
          echo "path=$module" >> "$GITHUB_OUTPUT"
      - name: Verify released dependency graph without a workspace
        working-directory: ${{ steps.module.outputs.path }}
        env:
          GOWORK: "off"
        run: |
          go mod download
          go vet ./...
          go test -race ./...
