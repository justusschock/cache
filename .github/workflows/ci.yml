name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - name: Enforce test assertion policy
        run: |
          if grep -REn --include='*_test.go' '\bt\.(Fatal|Fatalf|Error|Errorf|Fail|FailNow)\b' .; then
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      dragonfly:
        image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.38.0
        ports:
          - 6380:6379
      valkey:
        image: valkey/valkey:8.1-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      memcached:
        image: memcached:1.6-alpine
        ports:
          - 11211:11211
      hazelcast:
        image: hazelcast/hazelcast:5.5
        ports:
          - 5701:5701
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cache_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cache_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      REDIS_ADDR: 127.0.0.1:6379
      DRAGONFLY_ADDR: 127.0.0.1:6380
      VALKEY_ADDR: 127.0.0.1:6381
      MEMCACHED_ADDR: 127.0.0.1:11211
      HAZELCAST_ADDR: 127.0.0.1:5701
      POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/cache_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Wait for services
        run: |
          for port in 6379 6380 6381 11211 5701 5432; do
            timeout 120 bash -c "until (echo > /dev/tcp/127.0.0.1/$port) >/dev/null 2>&1; do sleep 1; done"
          done
      - name: Redis integration tests
        run: go test -tags=integration -timeout=3m ./backend/redis
      - name: Dragonfly integration tests
        run: go test -tags=integration -timeout=3m ./backend/dragonfly
      - name: Valkey integration tests
        run: go test -tags=integration -timeout=3m ./backend/valkey
      - name: Memcached integration tests
        run: go test -tags=integration -timeout=3m ./backend/memcached
      - name: Hazelcast integration tests
        run: go test -tags=integration -timeout=3m ./backend/hazelcast
      - name: PostgreSQL integration tests
        run: go test -tags=integration -timeout=3m ./backend/postgres
